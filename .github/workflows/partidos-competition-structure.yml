name: Partidos competition structure

on:
  push:
    branches: [feat/partidos-competition-structure]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/partidos-competition-structure
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vincular modal a división y fase
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/PartidosMultirama.tsx')
          s=p.read_text()

          old="type Tournament={id:string;nombre:string;rama_id?:string|null;ramas?:{id:string;nombre:string;disciplina:string}|null};"
          new="""type Tournament={id:string;nombre:string;rama_id?:string|null;tipo_gestion?:'externo'|'organizado';formato_competencia?:string;estructura_estado?:string;ramas?:{id:string;nombre:string;disciplina:string}|null};
type TournamentDivision={id:string;nombre:string;categoria_id?:string|null;modalidad?:string|null};
type TournamentPhase={id:string;nombre:string;tipo:string;division_id?:string|null;orden:number};
type TournamentStructure={torneo:Tournament;divisiones:TournamentDivision[];fases:TournamentPhase[]};"""
          if s.count(old)!=1: raise SystemExit(f'tipo Tournament inesperado: {s.count(old)}')
          s=s.replace(old,new,1)

          old="type Match={id:string;torneo_id?:string|null;categoria_id:string;rama_id?:string|null;sede_id?:string|null;disciplina_codigo?:string|null;es_amistoso:boolean;rival:string;fecha:string;hora:string;hora_citacion?:string|null;ubicacion?:string|null;link_maps?:string|null;color_uniforme?:string|null;condicion?:string|null;cobra_arbitraje:boolean;monto_arbitraje_jugador:number;estado:string;goles_favor?:number;goles_contra?:number;torneos?:{id?:string;nombre:string}|null;categorias?:{id?:string;nombre:string}|null;ramas?:{id:string;nombre:string;disciplina:string}|null;sedes?:{id:string;nombre:string}|null;sport_profile:SportProfile};"
          new="type Match={id:string;torneo_id?:string|null;torneo_division_id?:string|null;torneo_fase_id?:string|null;categoria_id:string;rama_id?:string|null;sede_id?:string|null;disciplina_codigo?:string|null;es_amistoso:boolean;rival:string;fecha:string;hora:string;hora_citacion?:string|null;ubicacion?:string|null;link_maps?:string|null;color_uniforme?:string|null;condicion?:string|null;cobra_arbitraje:boolean;monto_arbitraje_jugador:number;estado:string;goles_favor?:number;goles_contra?:number;torneos?:{id?:string;nombre:string;tipo_gestion?:'externo'|'organizado';formato_competencia?:string}|null;torneo_divisiones?:TournamentDivision|null;torneo_fases?:TournamentPhase|null;categorias?:{id?:string;nombre:string}|null;ramas?:{id:string;nombre:string;disciplina:string}|null;sedes?:{id:string;nombre:string}|null;sport_profile:SportProfile};"
          if s.count(old)!=1: raise SystemExit(f'tipo Match inesperado: {s.count(old)}')
          s=s.replace(old,new,1)

          old="const blankForm={rama_id:'',categoria_id:'',torneo_id:'',es_amistoso:false,rival:'',fecha:'',hora:'12:00',hora_citacion:'11:00',ubicacion:'',link_maps:'',color_uniforme:'Titular',condicion:'Local',cobra_arbitraje:false,monto_arbitraje_jugador:'0'};"
          new="const blankForm={rama_id:'',categoria_id:'',torneo_id:'',torneo_division_id:'',torneo_fase_id:'',es_amistoso:false,rival:'',fecha:'',hora:'12:00',hora_citacion:'11:00',ubicacion:'',link_maps:'',color_uniforme:'Titular',condicion:'Local',cobra_arbitraje:false,monto_arbitraje_jugador:'0'};"
          if s.count(old)!=1: raise SystemExit(f'blank form inesperado: {s.count(old)}')
          s=s.replace(old,new,1)

          old="  const [profileLoading,setProfileLoading]=useState(false);\n  const [statsMatch,setStatsMatch]=useState<Match|null>(null);"
          new="  const [profileLoading,setProfileLoading]=useState(false);\n  const [tournamentStructure,setTournamentStructure]=useState<TournamentStructure|null>(null);\n  const [structureLoading,setStructureLoading]=useState(false);\n  const [statsMatch,setStatsMatch]=useState<Match|null>(null);"
          if s.count(old)!=1: raise SystemExit('state anchor inesperado')
          s=s.replace(old,new,1)

          old="""  const selectedBranch=branches.find((branch)=>branch.id===form.rama_id)||null;
  const formEventUi=formProfile?.eventUi||defaultEventUi;"""
          new="""  const selectedBranch=branches.find((branch)=>branch.id===form.rama_id)||null;
  const selectedTournament=branchTournaments.find((tournament)=>tournament.id===form.torneo_id)||null;
  const organizedTournament=selectedTournament?.tipo_gestion==='organizado';
  const availableDivisions=useMemo(()=>(tournamentStructure?.divisiones||[]).filter((division)=>!division.categoria_id||!form.categoria_id||division.categoria_id===form.categoria_id),[tournamentStructure,form.categoria_id]);
  const availablePhases=useMemo(()=>(tournamentStructure?.fases||[]).filter((phase)=>phase.division_id===form.torneo_division_id),[tournamentStructure,form.torneo_division_id]);
  const formEventUi=formProfile?.eventUi||defaultEventUi;"""
          if s.count(old)!=1: raise SystemExit('derived anchor inesperado')
          s=s.replace(old,new,1)

          old="""  const openCreate=()=>{const initialBranch=branchId||branches[0]?.id||'';setEditing(null);setForm({...blankForm,rama_id:initialBranch});setFormProfile(null);setModalOpen(true);if(initialBranch)void loadBranchProfile(initialBranch);};
  const openEdit=(match:Match)=>{setEditing(match);setForm({rama_id:match.rama_id||'',categoria_id:match.categoria_id||'',torneo_id:match.torneo_id||'',es_amistoso:match.es_amistoso,rival:match.rival||'',fecha:match.fecha||'',hora:String(match.hora||'').slice(0,5)||'12:00',hora_citacion:String(match.hora_citacion||'').slice(0,5)||'11:00',ubicacion:match.ubicacion||'',link_maps:match.link_maps||'',color_uniforme:match.color_uniforme||'',condicion:match.condicion||'Evento',cobra_arbitraje:Boolean(match.cobra_arbitraje),monto_arbitraje_jugador:String(match.monto_arbitraje_jugador||0)});applyProfile(match.sport_profile||null);setModalOpen(true);};
  const changeBranch=(next:string)=>{setForm((current)=>({...current,rama_id:next,categoria_id:'',torneo_id:''}));void loadBranchProfile(next);};
  const saveMatch=async()=>{
    if(!form.rama_id||!form.categoria_id||!form.rival.trim()||!form.fecha||!form.hora)return void notify('Rama, categoría, rival/evento, fecha y hora son obligatorios.');
    try{
      const body={...form,monto_arbitraje_jugador:Number(form.monto_arbitraje_jugador)||0};"""
          new="""  const loadTournamentStructure=async(tournamentId:string,preferredDivision='',preferredPhase='')=>{
    const tournament=tournaments.find((item)=>item.id===tournamentId)||null;
    if(!tournamentId||tournament?.tipo_gestion!=='organizado'){
      setTournamentStructure(null);
      setForm((current)=>({...current,torneo_division_id:'',torneo_fase_id:''}));
      return;
    }
    setStructureLoading(true);
    try{
      const response=await api.get(`/api/torneos/${tournamentId}/estructura`);
      const data=response.data.data as TournamentStructure;
      setTournamentStructure(data);
      setForm((current)=>({
        ...current,
        torneo_division_id:preferredDivision&&data.divisiones.some((item)=>item.id===preferredDivision)?preferredDivision:'',
        torneo_fase_id:preferredPhase&&data.fases.some((item)=>item.id===preferredPhase)?preferredPhase:'',
      }));
    }catch(error:any){setTournamentStructure(null);await notify(error.response?.data?.error||'No fue posible cargar la estructura del campeonato.');}
    finally{setStructureLoading(false);}
  };
  const openCreate=()=>{const initialBranch=branchId||branches[0]?.id||'';setEditing(null);setTournamentStructure(null);setForm({...blankForm,rama_id:initialBranch});setFormProfile(null);setModalOpen(true);if(initialBranch)void loadBranchProfile(initialBranch);};
  const openEdit=(match:Match)=>{setEditing(match);setTournamentStructure(null);setForm({rama_id:match.rama_id||'',categoria_id:match.categoria_id||'',torneo_id:match.torneo_id||'',torneo_division_id:match.torneo_division_id||'',torneo_fase_id:match.torneo_fase_id||'',es_amistoso:match.es_amistoso,rival:match.rival||'',fecha:match.fecha||'',hora:String(match.hora||'').slice(0,5)||'12:00',hora_citacion:String(match.hora_citacion||'').slice(0,5)||'11:00',ubicacion:match.ubicacion||'',link_maps:match.link_maps||'',color_uniforme:match.color_uniforme||'',condicion:match.condicion||'Evento',cobra_arbitraje:Boolean(match.cobra_arbitraje),monto_arbitraje_jugador:String(match.monto_arbitraje_jugador||0)});applyProfile(match.sport_profile||null);setModalOpen(true);if(match.torneo_id)void loadTournamentStructure(match.torneo_id,match.torneo_division_id||'',match.torneo_fase_id||'');};
  const changeBranch=(next:string)=>{setTournamentStructure(null);setForm((current)=>({...current,rama_id:next,categoria_id:'',torneo_id:'',torneo_division_id:'',torneo_fase_id:''}));void loadBranchProfile(next);};
  const changeCategory=(next:string)=>setForm((current)=>({...current,categoria_id:next,torneo_division_id:'',torneo_fase_id:''}));
  const changeTournament=(next:string)=>{setForm((current)=>({...current,torneo_id:next,torneo_division_id:'',torneo_fase_id:''}));void loadTournamentStructure(next);};
  const toggleFriendly=(checked:boolean)=>{if(checked)setTournamentStructure(null);setForm((current)=>({...current,es_amistoso:checked,torneo_id:checked?'':current.torneo_id,torneo_division_id:'',torneo_fase_id:''}));};
  const saveMatch=async()=>{
    if(!form.rama_id||!form.categoria_id||!form.rival.trim()||!form.fecha||!form.hora)return void notify('Rama, categoría, rival/evento, fecha y hora son obligatorios.');
    if(!form.es_amistoso&&organizedTournament&&(!form.torneo_division_id||!form.torneo_fase_id))return void notify('Selecciona la división y fase del encuentro dentro del campeonato organizado.');
    try{
      const body={...form,monto_arbitraje_jugador:Number(form.monto_arbitraje_jugador)||0};"""
          if s.count(old)!=1: raise SystemExit(f'functions block inesperado: {s.count(old)}')
          s=s.replace(old,new,1)

          old="<p className=\"mt-1 text-xs text-[#8b949e]\">{match.ramas?.nombre||'Sin rama'} · {match.categorias?.nombre||'Sin categoría'}{match.torneos?.nombre?` · ${match.torneos.nombre}`:' · Amistoso/actividad'}</p>"
          new="<p className=\"mt-1 text-xs text-[#8b949e]\">{match.ramas?.nombre||'Sin rama'} · {match.categorias?.nombre||'Sin categoría'}{match.torneos?.nombre?` · ${match.torneos.nombre}`:' · Amistoso/actividad'}{match.torneo_divisiones?.nombre?` · ${match.torneo_divisiones.nombre}`:''}{match.torneo_fases?.nombre?` · ${match.torneo_fases.nombre}`:''}</p>"
          if s.count(old)!=1: raise SystemExit('subtitle match inesperado')
          s=s.replace(old,new,1)

          old="""<select value={form.categoria_id} onChange={(event)=>setForm({...form,categoria_id:event.target.value})} className={field}><option value="">Categoría *</option>{branchCategories.map((category)=><option key={category.id} value={category.id}>{category.nombre}</option>)}</select><label className="flex items-center gap-3 rounded-xl border border-white/10 bg-[#0d1117] p-3 text-sm font-bold"><input type="checkbox" checked={form.es_amistoso} onChange={(event)=>setForm({...form,es_amistoso:event.target.checked,torneo_id:event.target.checked?'':form.torneo_id})}/>Encuentro amistoso / independiente</label>{!form.es_amistoso?<select value={form.torneo_id} onChange={(event)=>setForm({...form,torneo_id:event.target.value})} className={field}><option value="">Selecciona torneo de la rama</option>{branchTournaments.filter((item)=>item.rama_id===form.rama_id).map((item)=><option key={item.id} value={item.id}>{item.nombre}</option>)}</select>:null}<input value={form.rival}"""
          new="""<select value={form.categoria_id} onChange={(event)=>changeCategory(event.target.value)} className={field}><option value="">Categoría *</option>{branchCategories.map((category)=><option key={category.id} value={category.id}>{category.nombre}</option>)}</select><label className="flex items-center gap-3 rounded-xl border border-white/10 bg-[#0d1117] p-3 text-sm font-bold"><input type="checkbox" checked={form.es_amistoso} onChange={(event)=>toggleFriendly(event.target.checked)}/>Encuentro amistoso / independiente</label>{!form.es_amistoso?<><select value={form.torneo_id} onChange={(event)=>changeTournament(event.target.value)} className={field}><option value="">Selecciona torneo de la rama</option>{branchTournaments.filter((item)=>item.rama_id===form.rama_id).map((item)=><option key={item.id} value={item.id}>{item.nombre}{item.tipo_gestion==='organizado'?' · Organizado':' · Externo'}</option>)}</select>{organizedTournament?(structureLoading?<div className="rounded-xl border border-[#289E9D]/20 bg-[#289E9D]/10 p-3 text-xs font-bold text-[#70e4df]">Cargando divisiones y fases…</div>:<div className="rounded-2xl border border-[#C8A96B]/25 bg-[#C8A96B]/10 p-4"><p className="text-[10px] font-black uppercase tracking-[.14em] text-[#D8BE87]">Ubicación dentro del campeonato</p><p className="mt-1 text-xs leading-5 text-[#b8ad95]">Este encuentro alimentará la tabla, llave o ranking de la división y fase seleccionadas.</p><div className="mt-3 grid gap-3 sm:grid-cols-2"><select value={form.torneo_division_id} onChange={(event)=>setForm({...form,torneo_division_id:event.target.value,torneo_fase_id:''})} className={field}><option value="">División / modalidad *</option>{availableDivisions.map((division)=><option key={division.id} value={division.id}>{division.nombre}{division.modalidad?` · ${division.modalidad}`:''}</option>)}</select><select value={form.torneo_fase_id} onChange={(event)=>setForm({...form,torneo_fase_id:event.target.value})} className={field} disabled={!form.torneo_division_id}><option value="">Fase / ronda *</option>{availablePhases.map((phase)=><option key={phase.id} value={phase.id}>{phase.orden}. {phase.nombre} · {phase.tipo}</option>)}</select></div>{!availableDivisions.length?<p className="mt-3 text-xs font-bold text-amber-200">No hay divisiones compatibles con esta categoría. Configúralas desde la gestión del campeonato antes de programar el encuentro.</p>:form.torneo_division_id&&!availablePhases.length?<p className="mt-3 text-xs font-bold text-amber-200">Esta división aún no tiene fases configuradas.</p>:null}</div>):selectedTournament?<div className="rounded-xl border border-sky-400/20 bg-sky-500/10 p-3 text-xs leading-5 text-sky-100/80"><strong className="text-sky-200">Campeonato externo:</strong> Lestra registra este encuentro dentro del evento, sin reemplazar las llaves o fases administradas por el organizador.</div>:null}</>:null}<input value={form.rival}"""
          if s.count(old)!=1: raise SystemExit(f'modal tournament block inesperado: {s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - run: npm run build
      - name: Guardar cambio limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/partidos-competition-structure.yml
          git add src/pages/PartidosMultirama.tsx
          git commit -m "feat: vincular encuentros a división y fase"
          git push origin HEAD:feat/partidos-competition-structure
