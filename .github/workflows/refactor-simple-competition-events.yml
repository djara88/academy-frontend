name: Refactor simple competition events
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  integrate:
    if: github.head_ref == 'refactor/simple-competitions-events'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/simple-competitions-events
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Adaptar Partidos a eventos competitivos
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/PartidosMultirama.tsx')
          s=p.read_text()
          replacements=[
            ("import { useCallback, useEffect, useMemo, useState } from 'react';\n", "import { useCallback, useEffect, useMemo, useState } from 'react';\nimport { useSearchParams } from 'react-router-dom';\n"),
            ("  const { notify, confirmAction } = useAppDialog();\n", "  const { notify, confirmAction } = useAppDialog();\n  const [searchParams] = useSearchParams();\n  const requestedTournamentId = searchParams.get('torneo_id') || '';\n"),
            ("        api.get('/api/partidos', { params: branchId ? { rama_id: branchId } : undefined }),", "        api.get('/api/partidos', { params: requestedTournamentId ? { torneo_id: requestedTournamentId } : branchId ? { rama_id: branchId } : undefined }),"),
            ("  }, [branchId, notify]);", "  }, [branchId, notify, requestedTournamentId]);"),
            ("    const initialBranch = branchId || branches[0]?.id || '';\n", "    const requestedTournament = tournaments.find((item) => item.id === requestedTournamentId) || null;\n    const initialBranch = requestedTournament?.rama_id || branchId || branches[0]?.id || '';\n"),
            ("    setForm({ ...blankForm, rama_id: initialBranch });", "    setForm({ ...blankForm, rama_id: initialBranch, torneo_id: requestedTournament?.id || '' });"),
            ("'Encuentro actualizado.' : 'Encuentro creado dentro de la rama seleccionada.'", "'Evento actualizado.' : 'Evento competitivo creado.'"),
            ("`¿Eliminar el encuentro contra/evento ${match.rival}?`", "`¿Eliminar este ${match.sport_profile?.activityLabel?.toLowerCase() || 'evento'}: ${match.rival}?`"),
            (">Encuentros multirrama<", ">Eventos multideporte<"),
            (">Partidos y competencias<", ">Competencias y resultados<"),
            ("La categoría define la rama del encuentro. En competencias organizadas, cada encuentro queda conectado además a su división y fase.", "Cada campeonato agrupa los eventos donde participa la academia. Lestra adapta cada evento y sus resultados a la disciplina: partido, duelo, prueba, carrera o presentación."),
            (">+ Nuevo encuentro<", ">+ Nuevo evento<"),
            ("Cargando encuentros...", "Cargando eventos..."),
            ("No hay encuentros en el alcance seleccionado.", "No hay eventos competitivos en el alcance seleccionado."),
            ("{editing ? 'Editar' : 'Nuevo'} encuentro", "{editing ? 'Editar' : 'Nuevo'} {formProfile?.activityLabel?.toLowerCase() || 'evento competitivo'}"),
            ("Lestra adapta condición, equipamiento y etiquetas a esta disciplina; categorías y torneos de otras ramas quedan bloqueados.", "Lestra adapta este evento, su equipamiento y sus métricas a la disciplina; categorías y campeonatos de otras ramas quedan bloqueados."),
            ("Encuentro amistoso / independiente", "Evento independiente / fuera de campeonato"),
            ("Selecciona torneo de la rama", "Campeonato / competencia"),
            ("{item.nombre}{item.tipo_gestion === 'organizado' ? ' · Organizado' : ' · Externo'}", "{item.nombre}"),
            ("{editing ? 'Guardar cambios' : 'Crear encuentro'}", "{editing ? 'Guardar cambios' : `Crear ${formProfile?.activityLabel?.toLowerCase() || 'evento'}` }"),
            ("Marcador del encuentro", "Resultado del evento"),
          ]
          for old,new in replacements:
              if old not in s:
                  print('AVISO no encontrado:', old[:100])
              s=s.replace(old,new)
          # Añadir etiqueta de tipo de evento junto a la disciplina.
          needle="<span className=\"rounded-full bg-violet-500/10 px-2.5 py-1 text-[10px] font-black uppercase text-violet-300\">{match.ramas?.disciplina || match.sport_profile?.label || 'Histórico'}</span>"
          addition=needle+"\n                    <span className=\"rounded-full bg-[#289E9D]/10 px-2.5 py-1 text-[10px] font-black uppercase text-[#70e4df]\">{match.sport_profile?.activityLabel || 'Evento'}</span>"
          if needle in s:
              s=s.replace(needle,addition,1)
          else:
              print('AVISO etiqueta de disciplina no encontrada')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "djara88"
          git config user.email "d.jarazerene@gmail.com"
          git rm .github/workflows/refactor-simple-competition-events.yml
          git add src/pages/PartidosMultirama.tsx
          git commit -m "Refactorizar partidos como eventos competitivos" || true
          git push origin HEAD:refactor/simple-competitions-events
