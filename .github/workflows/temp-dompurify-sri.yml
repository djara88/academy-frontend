name: Temporary npm metadata verification
on:
  push:
    branches:
      - security/node-24.22.1-oct2026
permissions:
  contents: read
jobs:
  verify-dompurify-sri:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read published npm package integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "Package: dompurify@3.4.17"
          npm view dompurify@3.4.17 dist.integrity
          npm view dompurify@3.4.17 dist.tarball
