name: Apply import template and tutor edit patch

on:
  push:
    branches:
      - agent/import-template-tutor-edit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[import-tutor-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-template-tutor-edit
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/patch_import_template_tutor_edit.py
      - run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Importacion.tsx src/pages/Apoderados.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Agregar matriz y edición de apoderados [import-tutor-patch]"
          git push origin HEAD:agent/import-template-tutor-edit
