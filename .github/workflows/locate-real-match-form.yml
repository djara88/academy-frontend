name: Locate real match form

on:
  push:
    branches: [fix/real-adaptive-match-form]

permissions:
  contents: write

jobs:
  locate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-adaptive-match-form
      - name: Locate exact UI strings
        run: |
          {
            echo '=== Contexto deportivo ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'Contexto deportivo' src || true
            echo '=== Encuentro amistoso / independiente ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'Encuentro amistoso / independiente' src || true
            echo '=== Cobrar arbitraje/jueces por alumno ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'Cobrar arbitraje/jueces por alumno' src || true
            echo '=== Neutral ==='
            grep -RIn --exclude-dir=node_modules --exclude-dir=.git '>Neutral<' src || true
          } > .github/real-match-form-locations.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/real-match-form-locations.txt
          git commit -m "chore: registrar ubicación del formulario real" || exit 0
          git push
