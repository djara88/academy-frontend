name: Integrate Professor Director Cases

on:
  push:
    branches: [feat/professor-ops-v1]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professor-ops-v1
      - name: Integrar sin alterar permisos existentes
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/pages/ProfesoresMultirama.tsx')
          text = path.read_text()
          import_anchor = "import { getAcademyName } from '../config/brand';\n"
          new_import = "import DirectorProfessorCasesPanel from '../components/profesor/DirectorProfessorCasesPanel';\n"
          if new_import not in text:
              if import_anchor not in text:
                  raise SystemExit('No se encontró el ancla de imports')
              text = text.replace(import_anchor, import_anchor + new_import, 1)
          insert_anchor = "</section>\n\n    {modalOpen?"
          insertion = "</section>\n\n    <DirectorProfessorCasesPanel />\n\n    {modalOpen?"
          if '<DirectorProfessorCasesPanel />' not in text:
              if insert_anchor not in text:
                  raise SystemExit('No se encontró el ancla antes del modal')
              text = text.replace(insert_anchor, insertion, 1)
          path.write_text(text)
      - name: Retirar automatizaciones temporales
        run: |
          rm -f .github/workflows/fix-professor-ops-unused.yml
          rm -f .github/workflows/integrate-professor-director-cases.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProfesoresMultirama.tsx .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrar casos y feedback en dirección"
          git push
