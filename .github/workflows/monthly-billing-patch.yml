name: Apply monthly billing UI patch

on:
  push:
    branches:
      - agent/monthly-billing-calendar

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/monthly-billing-calendar
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aplicar cambios de Finanzas
        run: python3 scripts/patch_finance_monthly_ui.py
      - name: Validar frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Finanzas.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Distinguir próximos pagos y deuda vencida [monthly-ui-patch]"
          git push origin HEAD:agent/monthly-billing-calendar
