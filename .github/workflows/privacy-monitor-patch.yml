name: Apply privacy monitor UI patch

on:
  push:
    branches:
      - agent/privacy-monitor

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-monitor-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/privacy-monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar navegación y portal
        run: python3 scripts/patch_privacy_monitor.py
      - name: Validar frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/layouts/Layout.tsx src/pages/ApoderadoPortal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrar privacidad y monitor en interfaz [privacy-monitor-ui]"
          git push origin HEAD:agent/privacy-monitor
