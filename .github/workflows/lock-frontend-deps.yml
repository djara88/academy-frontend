name: Lock frontend dependencies
on:
  push:
    branches: [agent/prematricula-import-report-v2]
permissions:
  contents: write
jobs:
  lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prematricula-import-report-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Guardar lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Fijar dependencias reproducibles del frontend"
          git push origin HEAD:agent/prematricula-import-report-v2
