name: Diagnose real adaptive match form

on:
  push:
    branches: [fix/real-adaptive-match-form]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-adaptive-match-form
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ejecutar parche con diagnóstico
        shell: bash
        run: |
          set +e
          python - <<'PY' > .github/real-adaptive-diagnostic.txt 2>&1
          from pathlib import Path
          p=Path('src/pages/PartidosMultirama.tsx')
          s=p.read_text()
          checks=[
            ("sport", "type SportProfile={code:string;label:string;icon:string;activityLabel:string;opponentLabel:string;scoreLabel:string;usesHeadToHeadScore:boolean;metrics:Metric[]};"),
            ("blank", "const blankForm={rama_id:'',categoria_id:'',torneo_id:'',es_amistoso:false,rival:'',fecha:'',hora:'12:00',hora_citacion:'11:00',ubicacion:'',link_maps:'',color_uniforme:'Principal',condicion:'Local',cobra_arbitraje:false,monto_arbitraje_jugador:'0',costo_arbitraje_total:'0',costo_cancha:'0'};"),
            ("state", "  const [form,setForm]=useState({...blankForm});"),
            ("rival", '<input value={form.rival} onChange={(event)=>setForm({...form,rival:event.target.value})} className={field} placeholder="Rival / evento / prueba *"/>'),
            ("equipment", '<div className="grid gap-3 sm:grid-cols-2"><input value={form.color_uniforme} onChange={(event)=>setForm({...form,color_uniforme:event.target.value})} className={field} placeholder="Indumentaria"/><select value={form.condicion} onChange={(event)=>setForm({...form,condicion:event.target.value})} className={field}><option>Local</option><option>Visita</option><option>Neutral</option></select></div>'),
            ("banner", 'Perfil competitivo: <strong>{selectedBranch.disciplina}</strong>. Categorías y torneos de otras ramas quedan bloqueados.'),
          ]
          for name,needle in checks: print(name, needle in s)
          PY
          npm run build >> .github/real-adaptive-diagnostic.txt 2>&1
          echo "BUILD_EXIT=$?" >> .github/real-adaptive-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/real-adaptive-diagnostic.txt
          git commit -m "chore: diagnóstico formulario multirrama" || true
          git push || true
