name: Fix Professor Ops unused import

on:
  push:
    branches: [feat/professor-ops-v1]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/professor-ops-v1
      - name: Retirar import no usado
        run: |
          sed -i '/  ExclamationTriangleIcon,/d' src/components/profesor/ProfessorCasesPanel.tsx
      - name: Commit si corresponde
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/profesor/ProfessorCasesPanel.tsx
          git commit -m "fix: retirar import no usado en casos del profesor"
          git push
