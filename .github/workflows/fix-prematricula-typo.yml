name: Fix prematricula payload
on:
  push:
    branches: [agent/prematricula-import-report-v2]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prematricula-import-report-v2
      - name: Corregir payload
        run: |
          sed -i 's/^        decisiones,$/        decisiones: decisions,/' src/pages/PreMatriculaPublica.tsx
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PreMatriculaPublica.tsx
          git commit -m "Corregir decisiones en firma de pre-matrícula"
          git push origin HEAD:agent/prematricula-import-report-v2
