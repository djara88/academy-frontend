name: Validate privacy monitor UI

on:
  push:
    branches:
      - agent/privacy-monitor

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[privacy-monitor-ui-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/privacy-monitor
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar navegación y correcciones
        run: |
          python3 scripts/patch_privacy_monitor.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ApoderadoPortal.tsx')
          s = p.read_text().replace("String(item.tipo).replaceAll('_', ' ')", "String(item.tipo).split('_').join(' ')")
          p.write_text(s)
          p = Path('src/pages/PrivacyRequests.tsx')
          s = p.read_text()
          s = s.replace("tutor_principal_id?: string | null }", "tutor_principal_id?: string | null; privacy_anonymized_at?: string | null }")
          s = s.replace(".filter((p) => !p.id.startsWith('anon'))", ".filter((p) => !p.privacy_anonymized_at)")
          s = s.replace("sensitive ? 'danger' : 'default'))", "{ tone: sensitive ? 'danger' : 'default' }))")
          p.write_text(s)
          PY
      - name: Validar frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/layouts/Layout.tsx src/pages/ApoderadoPortal.tsx src/pages/PrivacyRequests.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Integrar privacidad y monitor en interfaz [privacy-monitor-ui-v2]"
          git push origin HEAD:agent/privacy-monitor
