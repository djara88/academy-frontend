name: Update competition plan copy
on:
  push:
    branches: [ fix/competitions-plan-gate-20260819 ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/competitions-plan-gate-20260819
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ajustar presentación comercial de planes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/SubscriptionCommercial.tsx')
          s=p.read_text()
          old=" formacion:['Hasta 100 alumnos','3 profesores','Matrícula, asistencia y finanzas','Torneos y radar deportivo estándar','1 sede y 1 rama'],\n competencia:['Hasta 300 alumnos','10 profesores','2 sedes y 2 ramas','Preparación de partidos y alertas','Criterios de evaluación personalizados','Grupos WhatsApp y exportaciones'],"
          new=" formacion:['Hasta 100 alumnos','3 profesores','Matrícula, asistencia y finanzas','Evaluaciones deportivas estándar','1 sede y 1 rama'],\n competencia:['Hasta 300 alumnos','10 profesores','2 sedes y 2 ramas','Campeonatos, eventos y resultados multideporte','Preparación de partidos y alertas','Criterios de evaluación personalizados','Grupos WhatsApp y exportaciones'],"
          if old not in s: raise SystemExit('No se encontró el catálogo comercial esperado')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm run build
      - name: Guardar cambio y retirar workflow temporal
        run: |
          git config user.name "djara88"
          git config user.email "d.jarazerene@gmail.com"
          git rm .github/workflows/plan-copy-competitions-temp.yml
          git add src/pages/SubscriptionCommercial.tsx
          git commit -m "Sacar competencias del plan Formación"
          git push origin HEAD:fix/competitions-plan-gate-20260819
