name: Apply real adaptive match form v2

on:
  push:
    branches: [fix/real-adaptive-match-form-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-adaptive-match-form-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Adaptar formulario multirrama real
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/PartidosMultirama.tsx')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s: raise SystemExit(f'{label} anchor missing')
              s=s.replace(old,new,1)
          rep("type SportProfile={code:string;label:string;icon:string;activityLabel:string;opponentLabel:string;scoreLabel:string;usesHeadToHeadScore:boolean;metrics:Metric[]};","type EventUi={conditionMode:'required'|'optional'|'hidden';equipmentMode:'uniform'|'freeform';equipmentLabel:string;equipmentPlaceholder?:string|null};\ntype SportProfile={code:string;label:string;icon:string;activityLabel:string;opponentLabel:string;scoreLabel:string;usesHeadToHeadScore:boolean;eventUi?:EventUi;metrics:Metric[]};",'SportProfile')
          rep("const blankForm={rama_id:'',categoria_id:'',torneo_id:'',es_amistoso:false,rival:'',fecha:'',hora:'12:00',hora_citacion:'11:00',ubicacion:'',link_maps:'',color_uniforme:'Principal',condicion:'Local',cobra_arbitraje:false,monto_arbitraje_jugador:'0',costo_arbitraje_total:'0',costo_cancha:'0'};","const blankForm={rama_id:'',categoria_id:'',torneo_id:'',es_amistoso:false,rival:'',fecha:'',hora:'12:00',hora_citacion:'11:00',ubicacion:'',link_maps:'',color_uniforme:'Titular',condicion:'Local',cobra_arbitraje:false,monto_arbitraje_jugador:'0',costo_arbitraje_total:'0',costo_cancha:'0'};\nconst defaultEventUi:EventUi={conditionMode:'optional',equipmentMode:'freeform',equipmentLabel:'Indumentaria / equipamiento',equipmentPlaceholder:'Equipamiento o implementación requerida'};\nconst legacyUniformValues=new Set(['Principal','Titular','Visita','Ambas','Ambas (Llevar ambos)','Indumentaria principal']);",'blankForm')
          rep("  const [form,setForm]=useState({...blankForm});","  const [form,setForm]=useState({...blankForm});\n  const [formProfile,setFormProfile]=useState<SportProfile|null>(null);\n  const [profileLoading,setProfileLoading]=useState(false);",'form state')
          rep("  const selectedBranch=branches.find((branch)=>branch.id===form.rama_id)||null;\n\n  const openCreate=()=>{const initialBranch=branchId||branches[0]?.id||'';setEditing(null);setForm({...blankForm,rama_id:initialBranch});setModalOpen(true);};\n  const openEdit=(match:Match)=>{setEditing(match);setForm({rama_id:match.rama_id||'',categoria_id:match.categoria_id||'',torneo_id:match.torneo_id||'',es_amistoso:match.es_amistoso,rival:match.rival||'',fecha:match.fecha||'',hora:String(match.hora||'').slice(0,5)||'12:00',hora_citacion:String(match.hora_citacion||'').slice(0,5)||'11:00',ubicacion:match.ubicacion||'',link_maps:match.link_maps||'',color_uniforme:match.color_uniforme||'Principal',condicion:match.condicion||'Local',cobra_arbitraje:Boolean(match.cobra_arbitraje),monto_arbitraje_jugador:String(match.monto_arbitraje_jugador||0),costo_arbitraje_total:'0',costo_cancha:'0'});setModalOpen(true);};\n  const changeBranch=(next:string)=>setForm((current)=>({...current,rama_id:next,categoria_id:'',torneo_id:''}));","  const selectedBranch=branches.find((branch)=>branch.id===form.rama_id)||null;\n  const formEventUi=formProfile?.eventUi||defaultEventUi;\n\n  const applyProfile=(profile:SportProfile|null)=>{\n    setFormProfile(profile);\n    const ui=profile?.eventUi||defaultEventUi;\n    setForm((current)=>{\n      const currentEquipment=String(current.color_uniforme||'').trim();\n      const color_uniforme=ui.equipmentMode==='uniform'?(legacyUniformValues.has(currentEquipment)?(currentEquipment==='Principal'?'Titular':currentEquipment):'Titular'):(legacyUniformValues.has(currentEquipment)?'':currentEquipment);\n      const condicion=ui.conditionMode==='hidden'?'Evento':ui.conditionMode==='required'?(['Local','Visita'].includes(current.condicion)?current.condicion:'Local'):(['Local','Visita','Evento'].includes(current.condicion)?current.condicion:'Evento');\n      return {...current,color_uniforme,condicion};\n    });\n  };\n  const loadBranchProfile=async(ramaId:string)=>{\n    if(!ramaId){applyProfile(null);return;}\n    setProfileLoading(true);\n    try{const response=await api.get('/api/sport-profiles',{params:{rama_id:ramaId}});applyProfile(response.data?.data?.competitive||null);}\n    catch(error){console.error('No fue posible cargar el perfil competitivo:',error);applyProfile(null);}\n    finally{setProfileLoading(false);}\n  };\n  const openCreate=()=>{const initialBranch=branchId||branches[0]?.id||'';setEditing(null);setForm({...blankForm,rama_id:initialBranch});setFormProfile(null);setModalOpen(true);if(initialBranch)void loadBranchProfile(initialBranch);};\n  const openEdit=(match:Match)=>{setEditing(match);setForm({rama_id:match.rama_id||'',categoria_id:match.categoria_id||'',torneo_id:match.torneo_id||'',es_amistoso:match.es_amistoso,rival:match.rival||'',fecha:match.fecha||'',hora:String(match.hora||'').slice(0,5)||'12:00',hora_citacion:String(match.hora_citacion||'').slice(0,5)||'11:00',ubicacion:match.ubicacion||'',link_maps:match.link_maps||'',color_uniforme:match.color_uniforme||'',condicion:match.condicion||'Evento',cobra_arbitraje:Boolean(match.cobra_arbitraje),monto_arbitraje_jugador:String(match.monto_arbitraje_jugador||0),costo_arbitraje_total:'0',costo_cancha:'0'});applyProfile(match.sport_profile||null);setModalOpen(true);};\n  const changeBranch=(next:string)=>{setForm((current)=>({...current,rama_id:next,categoria_id:'',torneo_id:''}));void loadBranchProfile(next);};",'profile/open/change')
          rep('<div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4"><div className="rounded-xl bg-[#0d1117] p-3"><p className="text-[9px] uppercase text-[#697586]">Citación</p><p className="text-sm font-black text-white">{String(match.hora_citacion||\'\').slice(0,5)||\'—\'}</p></div><div className="rounded-xl bg-[#0d1117] p-3"><p className="text-[9px] uppercase text-[#697586]">Condición</p><p className="text-sm font-black text-white">{match.condicion||\'—\'}</p></div><div className="rounded-xl bg-[#0d1117] p-3 sm:col-span-2"><p className="text-[9px] uppercase text-[#697586]">Lugar</p><p className="truncate text-sm font-black text-white">{match.ubicacion||\'Por confirmar\'}</p></div></div>','<div className="mt-4 grid grid-cols-2 gap-2 sm:grid-cols-4"><div className="rounded-xl bg-[#0d1117] p-3"><p className="text-[9px] uppercase text-[#697586]">Citación</p><p className="text-sm font-black text-white">{String(match.hora_citacion||\'\').slice(0,5)||\'—\'}</p></div>{match.sport_profile?.eventUi?.conditionMode!==\'hidden\'?<div className="rounded-xl bg-[#0d1117] p-3"><p className="text-[9px] uppercase text-[#697586]">Condición</p><p className="text-sm font-black text-white">{match.condicion||\'—\'}</p></div>:null}<div className={`rounded-xl bg-[#0d1117] p-3 ${match.sport_profile?.eventUi?.conditionMode===\'hidden\'?\'col-span-1 sm:col-span-3\':\'sm:col-span-2\'}`}><p className="text-[9px] uppercase text-[#697586]">Lugar</p><p className="truncate text-sm font-black text-white">{match.ubicacion||\'Por confirmar\'}</p></div></div>','card condition')
          rep('<input value={form.rival} onChange={(event)=>setForm({...form,rival:event.target.value})} className={field} placeholder="Rival / evento / prueba *"/>','<input value={form.rival} onChange={(event)=>setForm({...form,rival:event.target.value})} className={field} placeholder={`${formProfile?.opponentLabel||\'Rival / evento\'} *`}/>','rival')
          rep('<div className="grid gap-3 sm:grid-cols-2"><input value={form.color_uniforme} onChange={(event)=>setForm({...form,color_uniforme:event.target.value})} className={field} placeholder="Indumentaria"/><select value={form.condicion} onChange={(event)=>setForm({...form,condicion:event.target.value})} className={field}><option>Local</option><option>Visita</option><option>Neutral</option></select></div>',"{profileLoading?<div className=\"rounded-xl border border-[#289E9D]/20 bg-[#289E9D]/10 p-3 text-xs font-bold text-[#70e4df]\">Adaptando campos a la disciplina…</div>:<div className={`grid gap-3 ${formEventUi.conditionMode==='hidden'?'grid-cols-1':'sm:grid-cols-2'}`}>{formEventUi.equipmentMode==='uniform'?<select value={form.color_uniforme} onChange={(event)=>setForm({...form,color_uniforme:event.target.value})} className={field}><option value=\"Titular\">Indumentaria titular</option><option value=\"Visita\">Indumentaria visita</option><option value=\"Ambas (Llevar ambos)\">Llevar ambas</option></select>:<input value={form.color_uniforme} onChange={(event)=>setForm({...form,color_uniforme:event.target.value})} className={field} placeholder={formEventUi.equipmentPlaceholder||formEventUi.equipmentLabel}/>} {formEventUi.conditionMode!=='hidden'?<select value={form.condicion} onChange={(event)=>setForm({...form,condicion:event.target.value})} className={field}>{formEventUi.conditionMode==='optional'?<option value=\"Evento\">Evento / sede neutral</option>:null}<option value=\"Local\">Local</option><option value=\"Visita\">Visita</option></select>:null}</div>}",'equipment/condition')
          rep('Perfil competitivo: <strong>{selectedBranch.disciplina}</strong>. Categorías y torneos de otras ramas quedan bloqueados.','Perfil competitivo: <strong>{formProfile?.label||selectedBranch.disciplina}</strong>. Lestra adapta condición, equipamiento y etiquetas a esta disciplina; categorías y torneos de otras ramas quedan bloqueados.','banner')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Commit final
        run: |
          rm .github/workflows/apply-real-adaptive-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PartidosMultirama.tsx .github/workflows/apply-real-adaptive-v2.yml
          git commit -m "fix: adaptar formulario multirrama real por deporte"
          git push
