name: Apply real adaptive form in PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/real-adaptive-match-form
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python .github/patch-real-adaptive.py
      - run: npm run build
      - name: Commit final limpio
        run: |
          rm -f .github/patch-real-adaptive.py .github/workflows/pr-apply-real-adaptive.yml .github/workflows/fix-real-adaptive-match-form.yml .github/workflows/locate-real-match-form.yml .github/workflows/diagnose-real-adaptive-form.yml .github/real-match-form-locations.txt .github/real-adaptive-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PartidosMultirama.tsx .github
          git commit -m "fix: adaptar formulario multirrama real por deporte"
          git push origin HEAD:fix/real-adaptive-match-form
