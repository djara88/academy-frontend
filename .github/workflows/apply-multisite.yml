name: Apply multisite frontend patch
on:
  push:
    branches: [agent/multisite-multibranch]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multisite-multibranch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/applyMultisitePatch.mjs
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/App.tsx src/pages/Configuracion.tsx src/pages/MatriculaPreparacion.tsx
          git diff --cached --quiet || git commit -m "Conectar sedes y ramas al frontend"
          git push
