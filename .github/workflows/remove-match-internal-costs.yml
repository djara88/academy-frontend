name: Remove internal match costs from UI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/separate-match-costs-from-finance
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Retirar costos internos del formulario real de encuentros
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('src/pages/PartidosMultirama.tsx')
          s=p.read_text()
          before=s
          s=s.replace(",costo_arbitraje_total:'0',costo_cancha:'0'", '')
          s=s.replace(",costo_arbitraje_total:Number(form.costo_arbitraje_total)||0,costo_cancha:Number(form.costo_cancha)||0", '')
          s=re.sub(r"\{!editing\?<div className=\"grid gap-3 sm:grid-cols-2\"><input type=\"number\" min=\"0\" value=\{form\.costo_arbitraje_total\}.*?value=\{form\.costo_cancha\}.*?</div>:null\}", '', s, count=1, flags=re.S)
          s=s.replace('Cobrar arbitraje/jueces por alumno', 'Cobrar cuota de arbitraje/jueces al alumno')
          s=s.replace('placeholder="Valor por alumno"', 'placeholder="Monto a cobrar por alumno"')
          if s==before:
              raise SystemExit('No se aplicó ningún cambio')
          if 'costo_arbitraje_total' in s or 'costo_cancha' in s:
              raise SystemExit('Aún quedan campos de costos internos en PartidosMultirama.tsx')
          p.write_text(s)
          PY
      - run: npm run build
      - name: Guardar cambio limpio
        run: |
          rm -f .github/workflows/remove-match-internal-costs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PartidosMultirama.tsx .github/workflows/remove-match-internal-costs.yml
          git commit -m "ux: mover costos internos de encuentros a Finanzas"
          git push origin HEAD:fix/separate-match-costs-from-finance
