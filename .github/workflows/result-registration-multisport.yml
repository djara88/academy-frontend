name: Result registration multisport

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/result-registration-multisport
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Adaptar modal de resultado
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/PartidosMultirama.tsx')
          s = p.read_text()

          old_score = """{statsMatch.sport_profile?.usesHeadToHeadScore?<div className=\"mt-5 grid grid-cols-2 gap-3\"><label><span className=\"text-xs font-bold text-[#9aa6b5]\">A favor</span><input type=\"number\" min=\"0\" value={score.favor} onChange={(event)=>setScore({...score,favor:event.target.value})} className={`${field} mt-1 text-center text-xl font-black`}/></label><label><span className=\"text-xs font-bold text-[#9aa6b5]\">En contra</span><input type=\"number\" min=\"0\" value={score.contra} onChange={(event)=>setScore({...score,contra:event.target.value})} className={`${field} mt-1 text-center text-xl font-black`}/></label></div>:null}"""
          new_score = """{statsMatch.sport_profile?.usesHeadToHeadScore?<div className=\"mt-5 rounded-2xl border border-[#289E9D]/20 bg-[#0d1117] p-4\"><div className=\"mb-3\"><p className=\"text-[10px] font-black uppercase tracking-[.14em] text-[#70e4df]\">Marcador del encuentro</p><p className=\"mt-1 text-xs text-[#8b949e]\">Registra el resultado global en {statsMatch.sport_profile.scoreLabel.toLowerCase()}.</p></div><div className=\"grid grid-cols-2 gap-3\"><label><span className=\"text-xs font-bold text-[#9aa6b5]\">A favor · {statsMatch.sport_profile.scoreLabel}</span><input type=\"number\" min=\"0\" value={score.favor} onChange={(event)=>setScore({...score,favor:event.target.value})} className={`${field} mt-1 text-center text-xl font-black`}/></label><label><span className=\"text-xs font-bold text-[#9aa6b5]\">Rival · {statsMatch.sport_profile.scoreLabel}</span><input type=\"number\" min=\"0\" value={score.contra} onChange={(event)=>setScore({...score,contra:event.target.value})} className={`${field} mt-1 text-center text-xl font-black`}/></label></div></div>:<div className=\"mt-5 rounded-2xl border border-violet-400/20 bg-violet-500/10 p-4\"><p className=\"text-[10px] font-black uppercase tracking-[.14em] text-violet-300\">Resultado por deportista</p><p className=\"mt-1 text-sm font-black text-white\">{statsMatch.sport_profile.label} no requiere un marcador global.</p><p className=\"mt-1 text-xs leading-5 text-[#aab3c0]\">Registra debajo el desempeño de cada alumno en las métricas que correspondan. Los campos que no apliquen pueden quedar en 0.</p></div>}"""
          if s.count(old_score) != 1:
              raise SystemExit(f'Bloque score inesperado: {s.count(old_score)}')
          s = s.replace(old_score, new_score, 1)

          old_list = """<div className=\"mt-5 space-y-3\">{stats.map((player)=>"""
          new_list = """<div className=\"mt-5\"><div className=\"mb-3\"><p className=\"text-[10px] font-black uppercase tracking-[.14em] text-[#D8BE87]\">Desempeño individual</p><p className=\"mt-1 text-xs text-[#8b949e]\">Solo completa las métricas que correspondan a cada deportista.</p></div><div className=\"space-y-3\">{stats.map((player)=>"""
          if s.count(old_list) != 1:
              raise SystemExit(f'Inicio lista stats inesperado: {s.count(old_list)}')
          s = s.replace(old_list, new_list, 1)

          old_empty_close = """{!stats.length?<div className=\"rounded-xl border border-dashed border-white/10 p-8 text-center text-sm text-[#697586]\">Aún no hay alumnos confirmados para registrar estadísticas.</div>:null}</div><label className=\"mt-5 flex items-center gap-3 rounded-xl border border-[#289E9D]/20 bg-[#289E9D]/10 p-3 text-sm font-bold text-[#bff8f5]\"><input type=\"checkbox\" checked={sendReport} onChange={(event)=>setSendReport(event.target.checked)}/>Enviar informe individual por WhatsApp al guardar</label><button disabled={savingStats} onClick={()=>void saveStats()} className=\"mt-4 min-h-12 w-full rounded-xl bg-[#C8A96B] px-5 text-sm font-black text-[#15120c] disabled:opacity-50\">{savingStats?'Guardando...':'Guardar resultado y estadísticas'}</button>"""
          new_empty_close = """{!stats.length?<div className=\"rounded-xl border border-dashed border-white/10 p-8 text-center text-sm text-[#697586]\">Aún no hay alumnos confirmados para registrar estadísticas.</div>:null}</div></div><label className=\"mt-5 flex items-start gap-3 rounded-xl border border-[#289E9D]/20 bg-[#289E9D]/10 p-3 text-sm font-bold text-[#bff8f5]\"><input type=\"checkbox\" checked={sendReport} onChange={(event)=>setSendReport(event.target.checked)} className=\"mt-1\"/><span><span className=\"block\">Enviar resumen individual por WhatsApp a cada familia</span><span className=\"mt-1 block text-xs font-normal leading-5 text-[#8fc9c7]\">Lestra enviará el resultado y las métricas registradas de cada alumno. No se envía si esta opción queda desmarcada.</span></span></label><button disabled={savingStats||(!statsMatch.sport_profile?.usesHeadToHeadScore&&!stats.length)} onClick={()=>void saveStats()} className=\"mt-4 min-h-12 w-full rounded-xl bg-[#C8A96B] px-5 text-sm font-black text-[#15120c] disabled:opacity-50\">{savingStats?'Guardando...':sendReport?'Guardar y enviar informes':'Guardar resultado y estadísticas'}</button>"""
          if s.count(old_empty_close) != 1:
              raise SystemExit(f'Cierre stats inesperado: {s.count(old_empty_close)}')
          s = s.replace(old_empty_close, new_empty_close, 1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Guardar cambio limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/result-registration-multisport.yml
          git add src/pages/PartidosMultirama.tsx
          git commit -m "ux: adaptar registro de resultados por deporte"
          git push origin HEAD:fix/result-registration-multisport
