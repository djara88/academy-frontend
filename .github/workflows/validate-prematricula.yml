name: Validate prematricula frontend
on:
  push:
    branches: [agent/prematricula-import-report-v2]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high || true
