name: Apply prematricula RUT UI patch

on:
  push:
    branches:
      - agent/prematricula-rut-guard

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[prematricula-rut-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prematricula-rut-guard
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Aplicar UI de validación y edición
        run: python3 scripts/patch_prematricula_rut_guard.py
      - name: Validar frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/MatriculaPreparacion.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Validar RUT y editar prematrículas [prematricula-rut-ui]"
          git push origin HEAD:agent/prematricula-rut-guard
