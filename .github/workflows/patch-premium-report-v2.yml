name: Patch premium report v2

on:
  push:
    branches:
      - agent/premium-report-download

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-report-download
      - name: Aplicar parche
        run: python scripts/patch_premium_report.py
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar y capturar diagnóstico
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          echo $? > build-status.txt
          exit 0
      - name: Guardar parche y diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Jugadores.tsx build-output.txt build-status.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Diagnosticar descarga premium del informe"
          git push origin HEAD:agent/premium-report-download
