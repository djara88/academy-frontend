name: Phase 4 OpenTelemetry Lockfile

on:
  push:
    branches:
      - phase4/observability-opentelemetry
    paths:
      - package.json
      - .github/workflows/phase4-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase4/observability-opentelemetry
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize OpenTelemetry lockfile"
          git push origin HEAD:phase4/observability-opentelemetry
