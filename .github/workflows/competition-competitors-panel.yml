name: Competition competitors panel

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competition-competitors-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Integrar panel en gestión de competencia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/GestionarTorneoMultirama.tsx')
          s=p.read_text()
          old="import { useAppDialog } from '../contexts/DialogContext';"
          new=old+"\nimport CompetitionCompetitorsPanel from '../components/CompetitionCompetitorsPanel';"
          if s.count(old)!=1: raise SystemExit('import anchor inesperado')
          s=s.replace(old,new,1)
          anchor="""    {!tournament.rama_id?<div className=\"rounded-2xl border border-amber-400/20 bg-amber-500/10 p-5 text-sm leading-6 text-amber-200\">"""
          panel="""    {organized?<CompetitionCompetitorsPanel tournamentId={tournament.id} discipline={tournament.ramas?.disciplina||''} divisions={structure?.divisiones||[]} categories={categories}/>:null}\n\n"""
          if s.count(anchor)!=1: raise SystemExit('render anchor inesperado')
          s=s.replace(anchor,panel+anchor,1)
          p.write_text(s)
          PY
      - run: npm run build
      - name: Guardar cambio limpio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/competition-competitors-panel.yml
          git add src/pages/GestionarTorneoMultirama.tsx src/components/CompetitionCompetitorsPanel.tsx
          git commit -m "feat: gestionar competidores y preview de torneos"
          git push origin HEAD:feat/competition-competitors-preview
